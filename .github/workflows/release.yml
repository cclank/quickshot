name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: build:mac
            artifacts: release/*/*.dmg
          - os: windows-latest
            script: build:win
            artifacts: release/*/*-Setup.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Step conditions cannot read secrets directly.
      MAC_SIGNING: ${{ secrets.CSC_LINK != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Signing and notarization run only when the repository provides the
      # secrets; otherwise electron-builder produces unsigned installers.
      # CSC_LINK holds the macOS release certificate (docs/release-signing.md).
      - name: Build installers
        shell: bash
        run: |
          # An empty CSC_LINK makes electron-builder look for a certificate at
          # the project path, so drop the signing variables when unset. The
          # macOS certificate must not sign the Windows installer either.
          if [ -z "$CSC_LINK" ] || [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "$APPLE_ID" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      # Users granted Screen Recording to the release certificate; a build
      # signed with anything else would make macOS ask them again.
      - name: Check the macOS signature
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: node scripts/check-mac-signature.mjs release/*/mac*/QuickShot.app

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The update feed QuickShot reads from the release when it cannot reach
      # dl.lanshuagent.com (scripts/publish-update-feed.mjs mirrors it there).
      - name: Write update feed
        run: >-
          node scripts/write-update-feed.mjs installers "$GITHUB_REF_NAME"
          "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          installers/latest.json

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/**/*
