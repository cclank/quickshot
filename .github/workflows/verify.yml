name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify
      - name: Package Linux x64 directory
        run: npx electron-builder --linux --dir --x64 --config.directories.output="$RUNNER_TEMP/quickshot-package"
      - name: Verify packaged application
        run: node scripts/verify-package.mjs "$RUNNER_TEMP/quickshot-package/linux-unpacked"
      # Dependencies that ship in the app must be free of known advisories.
      # Build and test tooling, and Electron's own major upgrades, are handled
      # as separate dependency updates.
      - run: npm audit --omit=dev

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify
      - name: Package Windows x64 directory
        shell: bash
        run: npx electron-builder --win --dir --x64 --config.directories.output="$RUNNER_TEMP/quickshot-package"
      - name: Verify packaged application
        shell: bash
        run: node scripts/verify-package.mjs "$RUNNER_TEMP/quickshot-package/win-unpacked"

  ocr-macos:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: npm run test:scroll-stitcher
      - run: npm run build:ocr-helper:universal
      - name: Package macOS arm64 directory
        run: npx electron-builder --mac --dir --arm64 --config.directories.output="$RUNNER_TEMP/quickshot-package"
      - name: Verify packaged OCR
        run: |
          APP_PATH="$RUNNER_TEMP/quickshot-package/mac-arm64/QuickShot.app"
          OCR_HELPER="$APP_PATH/Contents/Resources/ocr/quickshot-ocr"
          node scripts/verify-package.mjs "$APP_PATH"
          node scripts/smoke-ocr-helper.mjs "$OCR_HELPER"
          lipo "$OCR_HELPER" -verify_arch x86_64 arm64
          codesign --verify --strict --verbose=4 "$OCR_HELPER"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
