<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>QuickShot Region Selector Fixture</title>
	</head>
	<body>
		<div id="root"></div>
		<script>
			// Renders the capture overlay against a fixed image instead of the screen.
			// ?scroll=available lets S switch to scrolling capture; ?scroll=on starts there.
			const parameters = new URLSearchParams(window.location.search);
			if (parameters.has("style")) localStorage.setItem("quickshot.style.v2", parameters.get("style"));
			const source = parameters.get("fixtureSource") || "/test-fixtures/sample-ui.svg";
			window.__quickshotRegionFixture = { actions: [] };

			async function screenBytes() {
				const image = new Image();
				image.src = source;
				await image.decode();
				const canvas = document.createElement("canvas");
				canvas.width = Math.round(window.innerWidth * (window.devicePixelRatio || 1));
				canvas.height = Math.round(window.innerHeight * (window.devicePixelRatio || 1));
				canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
				const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
				return new Uint8Array(await blob.arrayBuffer());
			}

			window.electronAPI = {
				platform: parameters.get("platform") || undefined,
				language: parameters.get("lang") || undefined,
				getRegionCaptureSession: async () => ({
					success: true,
					session: {
						sessionId: 1,
						imageBytes: await screenBytes(),
						scroll: parameters.get("scroll") === "on",
						scrollAvailable: parameters.has("scroll"),
						doubleClickCopy: parameters.has("doubleClickCopy"),
						styledCopy: !parameters.has("noStyledCopy"),
					},
				}),
				onCaptureSession: () => () => {},
				regionSelectorReady: async () => ({ success: true }),
				// Front-to-back mock windows laid over the sample screen.
				getCaptureWindows: async () => ({
					success: true,
					windows: [
						{ id: 102, x: Math.round(innerWidth * 0.73), y: Math.round(innerHeight * 0.38), width: Math.round(innerWidth * 0.25), height: Math.round(innerHeight * 0.45), app: "Calendar", title: "" },
						{ id: 101, x: Math.round(innerWidth * 0.2), y: Math.round(innerHeight * 0.14), width: Math.round(innerWidth * 0.78), height: Math.round(innerHeight * 0.84), app: "Northwind", title: "Overview" },
					],
				}),
				cancelCaptureSession: async () => {
					window.__quickshotRegionFixture.actions.push("cancel");
					document.documentElement.dataset.lastAction = "cancel";
					return { success: true };
				},
				screenshotRegionSelected: async (payload) => {
					window.__quickshotRegionFixture.actions.push(payload.action);
					document.documentElement.dataset.lastAction = payload.action;
					document.documentElement.dataset.lastRect = JSON.stringify(payload.rect ?? null);
					document.documentElement.dataset.lastWindowId = String(payload.windowId ?? "");
					document.documentElement.dataset.lastAnnotationCount = String(
						Array.isArray(payload.annotations) ? payload.annotations.length : 0,
					);
					document.documentElement.dataset.lastAnnotationKinds = Array.isArray(payload.annotations)
						? payload.annotations.map((mark) => mark?.kind).join(",")
						: "";
					const composed = payload.composedImageBytes;
					document.documentElement.dataset.lastComposedBytes =
						composed instanceof Uint8Array ? String(composed.byteLength) : "";
					if (composed instanceof Uint8Array) {
						window.__quickshotRegionFixture.composedSignature = Array.from(composed.slice(0, 8));
						const dimensions = new DataView(composed.buffer, composed.byteOffset, composed.byteLength);
						document.documentElement.dataset.composedWidth = String(dimensions.getUint32(16, false));
						document.documentElement.dataset.composedHeight = String(dimensions.getUint32(20, false));
						const download = document.createElement("a");
						download.dataset.fixtureExport = "true";
						download.textContent = "下载快速复制的 PNG";
						download.href = URL.createObjectURL(new Blob([composed], { type: "image/png" }));
						download.download = "QuickShot-quick-copy-fixture.png";
						download.style.cssText = "position:fixed;right:16px;bottom:10px;z-index:100;background:#2563eb;color:white;padding:8px 12px;border-radius:8px;font:12px sans-serif";
						document.body.append(download);
					}
					const cropped = payload.croppedImageBytes;
					if (cropped instanceof Uint8Array) {
						document.documentElement.dataset.lastCroppedBytes = String(cropped.byteLength);
						const dimensions = new DataView(cropped.buffer, cropped.byteOffset, cropped.byteLength);
						document.documentElement.dataset.croppedWidth = String(dimensions.getUint32(16, false));
						document.documentElement.dataset.croppedHeight = String(dimensions.getUint32(20, false));
						const download = document.createElement("a");
						download.dataset.fixtureExport = "true";
						download.textContent = `下载${payload.action}的 PNG`;
						download.href = URL.createObjectURL(new Blob([cropped], { type: "image/png" }));
						download.download = `QuickShot-${payload.action}-fixture.png`;
						download.style.cssText = "position:fixed;right:16px;bottom:10px;z-index:100;background:#2563eb;color:white;padding:8px 12px;border-radius:8px;font:12px sans-serif";
						document.body.append(download);
					}
					return { success: true };
				},
			};
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
